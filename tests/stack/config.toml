# Throwaway stack for `npm run test:stack`. The harness fills in a random project_id,
# so it never shares containers or volumes with any other local Supabase project.
project_id = "__PROJECT_ID__"

[api]
port = 57321

[db]
port = 57322
shadow_port = 57320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 57324

[storage]
enabled = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:57337"
additional_redirect_urls = ["http://127.0.0.1:57337/onboarding?continue=true"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "5s"

[auth.rate_limit]
email_sent = 1000

[edge_runtime]
enabled = true
inspector_port = 57083
